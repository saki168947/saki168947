<svg width="960" height="270" viewBox="0 0 960 270" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="playerTitle playerDesc">
  <title id="playerTitle">Now Playing: Natsukoi by Togawa Sakiko</title>
  <desc id="playerDesc">A sleek Ave Mujica themed music player widget with animated vinyl disc, dynamic audio waveform visualizer, background twinkling stars, progress bar, and controls.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C1E"/>
      <stop offset="50%" stop-color="#121838"/>
      <stop offset="100%" stop-color="#1A1430"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="playerBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5BCEFA" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#BACBFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F5A9B8" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Vinyl Center Gradient -->
    <radialGradient id="vinylCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F4B8CD"/>
      <stop offset="55%" stop-color="#7A3958"/>
      <stop offset="100%" stop-color="#14192E"/>
    </radialGradient>

    <!-- Progress Bar Gradient -->
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5BCEFA"/>
      <stop offset="50%" stop-color="#BACBFF"/>
      <stop offset="100%" stop-color="#F5A9B8"/>
    </linearGradient>

    <!-- Filter Glows -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="vinylGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#8FA9E6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Card Base -->
  <rect width="960" height="270" rx="22" fill="url(#cardBg)"/>

  <!-- DYNAMIC BACKGROUND LAYER: Breathing Nebula & Twinkling Stars -->
  <g filter="url(#neonGlow)">
    <circle cx="820" cy="80" r="100" fill="#D95A8D" opacity="0.15">
      <animate attributeName="opacity" values="0.1; 0.25; 0.1" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="180" cy="180" r="120" fill="#3B6CD4" opacity="0.2">
      <animate attributeName="opacity" values="0.15; 0.3; 0.15" dur="6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Twinkling Micro-Stars in Background -->
  <g fill="#FFFFFF">
    <circle cx="340" cy="30" r="1.5">
      <animate attributeName="opacity" values="0.2; 1; 0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="25" r="1.8">
      <animate attributeName="opacity" values="0.1; 0.9; 0.1" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="35" r="1.6">
      <animate attributeName="opacity" values="0.2; 1; 0.2" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="910" cy="150" r="1.8">
      <animate attributeName="opacity" values="0.15; 0.85; 0.15" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="230" r="1.4">
      <animate attributeName="opacity" values="0.2; 0.95; 0.2" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="245" r="1.5">
      <animate attributeName="opacity" values="0.1; 0.8; 0.1" dur="3.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Luminous Animated Border -->
  <rect x="1" y="1" width="958" height="268" rx="21" stroke="url(#playerBorder)" stroke-width="1.8">
    <animate attributeName="stroke-opacity" values="0.6; 1; 0.6" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Left: Animated Rotating Vinyl Record -->
  <g transform="translate(135, 135)" filter="url(#vinylGlow)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>

      <!-- Vinyl Body -->
      <circle cx="0" cy="0" r="92" fill="#0B0F20" stroke="#253258" stroke-width="2"/>

      <!-- Vinyl Grooves -->
      <circle cx="0" cy="0" r="84" stroke="#182342" stroke-width="1" stroke-dasharray="10 4" opacity="0.75"/>
      <circle cx="0" cy="0" r="76" stroke="#182342" stroke-width="0.8" opacity="0.6"/>
      <circle cx="0" cy="0" r="68" stroke="#283864" stroke-width="1" stroke-dasharray="14 5" opacity="0.55"/>
      <circle cx="0" cy="0" r="60" stroke="#182342" stroke-width="0.8" opacity="0.6"/>
      <circle cx="0" cy="0" r="52" stroke="#283864" stroke-width="0.8" stroke-dasharray="8 4" opacity="0.5"/>

      <!-- Surface Light Sheen -->
      <path d="M-65 -65 L-12 -12 A 88 88 0 0 1 65 -65 Z" fill="#FFFFFF" fill-opacity="0.05"/>
      <path d="M65 65 L12 12 A 88 88 0 0 1 -65 65 Z" fill="#FFFFFF" fill-opacity="0.05"/>

      <!-- Vinyl Center Label -->
      <circle cx="0" cy="0" r="36" fill="url(#vinylCenter)" stroke="#F5A9B8" stroke-width="1.2"/>

      <!-- Center Moon & Sparkle Emblem -->
      <path d="M-10 -12 C-3 -12 5 -6 5 4 C5 12 -3 18 -10 18 C-4 15 0 9 0 4 C0 -3 -4 -8 -10 -12 Z" fill="#FFFFFF" opacity="0.9"/>
      <circle cx="7" cy="-7" r="2.2" fill="#FCE4EC"/>
      <text x="0" y="25" fill="#BACBFF" font-size="6.5" font-weight="700" letter-spacing="1" text-anchor="middle" font-family="'Palatino Linotype', 'Georgia', serif">
        AVE MUJICA
      </text>

      <!-- Spindle Hole -->
      <circle cx="0" cy="0" r="6.5" fill="#080C1E" stroke="#DCE7FD" stroke-width="1"/>
    </g>
  </g>

  <!-- Static Tonearm -->
  <g transform="translate(135, 135)">
    <circle cx="96" cy="-94" r="8" fill="#1C274B" stroke="#8FA9E6" stroke-width="1.5"/>
    <circle cx="96" cy="-94" r="3.5" fill="#BACBFF"/>
    <line x1="96" y1="-88" x2="38" y2="-22" stroke="#BACBFF" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="38" cy="-22" r="4" fill="#F5A9B8" stroke="#FFFFFF" stroke-width="1"/>
  </g>

  <!-- Floating Musical Notes & Ribbon Hearts -->
  <g filter="url(#neonGlow)">
    <g transform="translate(55, 70)">
      <animateTransform attributeName="transform" type="translate" values="55 70; 57 60; 55 52; 53 62; 55 70" dur="4.2s" repeatCount="indefinite"/>
      <text x="0" y="0" fill="#5BCEFA" font-size="16" font-family="'Segoe UI Symbol', sans-serif">♪</text>
    </g>
    <g transform="translate(235, 60)">
      <animateTransform attributeName="transform" type="translate" values="235 60; 238 50; 235 42; 232 52; 235 60" dur="5.0s" repeatCount="indefinite"/>
      <text x="0" y="0" fill="#F5A9B8" font-size="18" font-family="'Segoe UI Symbol', sans-serif">♫</text>
    </g>
    <g transform="translate(220, 215)">
      <animateTransform attributeName="transform" type="translate" values="220 215; 222 205; 220 198; 218 206; 220 215" dur="4.6s" repeatCount="indefinite"/>
      <text x="0" y="0" fill="#BACBFF" font-size="14" font-family="'Segoe UI Symbol', sans-serif">♡</text>
    </g>
  </g>

  <!-- Right: Track Info & Controls -->
  <g transform="translate(280, 36)">
    <!-- Top Pill: Status & Audio Badge -->
    <rect x="0" y="0" width="144" height="26" rx="13" fill="#18244B" stroke="#5BCEFA" stroke-width="1.2"/>
    <!-- Pulsing Live Dot -->
    <circle cx="16" cy="13" r="3.5" fill="#5BCEFA">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3.5;4.5;3.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="17" fill="#BACBFF" font-size="11" font-weight="700" letter-spacing="1.5" font-family="'Palatino Linotype', 'Georgia', sans-serif">
      NOW PLAYING
    </text>

    <!-- Genre & Hi-Res Badge -->
    <text x="156" y="18" fill="#F5A9B8" font-size="12" font-weight="600" letter-spacing="1" font-family="'Palatino Linotype', 'Georgia', sans-serif">
      ♡ Ave Mujica · Piano &amp; Strings · FLAC 96kHz/24bit ♡
    </text>

    <!-- Song Title with Cute Flair -->
    <text x="0" y="64" fill="#FFFFFF" font-size="28" font-weight="700" font-style="italic" letter-spacing="1" font-family="'Palatino Linotype', 'Georgia', 'PingFang SC', sans-serif">
      《夏恋》 <tspan fill="#F5A9B8" font-size="20" font-weight="500">/ Natsukoi</tspan>
    </text>

    <!-- Artist Name in Cute Styling -->
    <text x="0" y="92" fill="#BACBFF" font-size="15" font-weight="600" font-family="'Palatino Linotype', 'Georgia', 'PingFang SC', sans-serif">
      🌸 丰川祥子 (Togawa Sakiko) · Oblivionis
    </text>

    <!-- Lyric Snippet in Cute Italic Serif -->
    <text x="0" y="120" fill="#E1ECFE" font-size="14" font-style="italic" font-family="'Palatino Linotype', 'Georgia', 'Yu Mincho', serif">
      “ 夏の風がそっと、想い出を連れてくる… 忘れられない旋律 ✧ ”
    </text>

    <!-- Audio Waveform Visualizer (Animated Equalizer Bars) -->
    <g transform="translate(480, 42)" fill="url(#progressGrad)">
      <rect x="0" y="14" width="3.5" height="16" rx="1.75">
        <animate attributeName="y" values="18;6;14;2;12;18" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="height" values="12;24;16;28;18;12" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="9" y="8" width="3.5" height="22" rx="1.75">
        <animate attributeName="y" values="8;20;6;16;4;8" dur="0.95s" repeatCount="indefinite"/>
        <animate attributeName="height" values="22;10;24;14;26;22" dur="0.95s" repeatCount="indefinite"/>
      </rect>
      <rect x="18" y="2" width="3.5" height="28" rx="1.75">
        <animate attributeName="y" values="2;16;4;22;8;2" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="height" values="28;14;26;8;22;28" dur="1.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="27" y="10" width="3.5" height="20" rx="1.75">
        <animate attributeName="y" values="12;4;18;8;2;12" dur="1.05s" repeatCount="indefinite"/>
        <animate attributeName="height" values="18;26;12;22;28;18" dur="1.05s" repeatCount="indefinite"/>
      </rect>
      <rect x="36" y="16" width="3.5" height="14" rx="1.75">
        <animate attributeName="y" values="16;8;22;10;4;16" dur="0.85s" repeatCount="indefinite"/>
        <animate attributeName="height" values="14;22;8;20;26;14" dur="0.85s" repeatCount="indefinite"/>
      </rect>
      <rect x="45" y="4" width="3.5" height="26" rx="1.75">
        <animate attributeName="y" values="4;18;8;24;6;4" dur="1.15s" repeatCount="indefinite"/>
        <animate attributeName="height" values="26;12;22;6;24;26" dur="1.15s" repeatCount="indefinite"/>
      </rect>
      <rect x="54" y="8" width="3.5" height="22" rx="1.75">
        <animate attributeName="y" values="8;22;4;16;10;8" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="height" values="22;8;26;14;20;22" dur="1.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="63" y="14" width="3.5" height="16" rx="1.75">
        <animate attributeName="y" values="14;4;18;6;20;14" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="height" values="16;26;12;24;10;16" dur="0.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="72" y="3" width="3.5" height="27" rx="1.75">
        <animate attributeName="y" values="3;15;8;22;4;3" dur="1.25s" repeatCount="indefinite"/>
        <animate attributeName="height" values="27;15;22;8;26;27" dur="1.25s" repeatCount="indefinite"/>
      </rect>
      <rect x="81" y="9" width="3.5" height="21" rx="1.75">
        <animate attributeName="y" values="9;21;6;14;3;9" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="height" values="21;9;24;16;27;21" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="90" y="15" width="3.5" height="15" rx="1.75">
        <animate attributeName="y" values="15;5;20;8;2;15" dur="1.35s" repeatCount="indefinite"/>
        <animate attributeName="height" values="15;25;10;22;28;15" dur="1.35s" repeatCount="indefinite"/>
      </rect>
      <rect x="99" y="7" width="3.5" height="23" rx="1.75">
        <animate attributeName="y" values="7;19;4;16;8;7" dur="0.8s" repeatCount="indefinite"/>
        <animate attributeName="height" values="23;11;26;14;22;23" dur="0.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="108" y="13" width="3.5" height="17" rx="1.75">
        <animate attributeName="y" values="13;3;17;7;21;13" dur="1.0s" repeatCount="indefinite"/>
        <animate attributeName="height" values="17;27;13;23;9;17" dur="1.0s" repeatCount="indefinite"/>
      </rect>
      <rect x="117" y="5" width="3.5" height="25" rx="1.75">
        <animate attributeName="y" values="5;17;8;23;6;5" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="height" values="25;13;22;7;24;25" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="126" y="16" width="3.5" height="14" rx="1.75">
        <animate attributeName="y" values="16;6;20;10;4;16" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="height" values="14;24;10;20;26;14" dur="0.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="135" y="10" width="3.5" height="20" rx="1.75">
        <animate attributeName="y" values="10;22;5;18;8;10" dur="1.15s" repeatCount="indefinite"/>
        <animate attributeName="height" values="20;8;25;12;22;20" dur="1.15s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Progress Bar Section -->
    <g transform="translate(0, 144)">
      <text x="0" y="8" fill="#BACBFF" font-size="12" font-family="'SF Mono', 'Consolas', monospace">01:28</text>
      <!-- Background Bar -->
      <rect x="48" y="1" width="510" height="5" rx="2.5" fill="#202A4F"/>
      <!-- Active Progress Bar (38%) -->
      <rect x="48" y="1" width="194" height="5" rx="2.5" fill="url(#progressGrad)"/>
      <!-- Playhead Dot with Starburst -->
      <circle cx="242" cy="3.5" r="6" fill="#FFFFFF" stroke="#F5A9B8" stroke-width="2" filter="url(#neonGlow)"/>
      <text x="570" y="8" fill="#8FA9E6" font-size="12" font-family="'SF Mono', 'Consolas', monospace">03:45</text>
    </g>

    <!-- Player Controls Row -->
    <g transform="translate(250, 185)">
      <!-- Shuffle -->
      <g transform="translate(-130, 0)">
        <path d="M-8 -6 L-2 -6 L4 4 L8 4 M8 1 L11 4 L8 7 M-8 4 L-5 4 L-3 1 M3 -3 L5 -6 L8 -6 M8 -9 L11 -6 L8 -3" stroke="#7E96CC" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>

      <!-- Previous Track -->
      <g transform="translate(-65, 0)" fill="#BACBFF">
        <path d="M-10 0 L-2 -7 L-2 -1 L6 -7 L6 7 L-2 1 L-2 7 Z"/>
        <line x1="-12" y1="-7" x2="-12" y2="7" stroke="#BACBFF" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- Play / Pause Circle (Main Action) -->
      <g transform="translate(0, 0)">
        <circle cx="0" cy="0" r="21" fill="url(#progressGrad)" filter="url(#neonGlow)"/>
        <rect x="-6" y="-9" width="4.5" height="18" rx="2" fill="#0A0E22"/>
        <rect x="2.5" y="-9" width="4.5" height="18" rx="2" fill="#0A0E22"/>
      </g>

      <!-- Next Track -->
      <g transform="translate(65, 0)" fill="#BACBFF">
        <path d="M10 0 L2 -7 L2 -1 L-6 -7 L-6 7 L2 1 L2 7 Z"/>
        <line x1="12" y1="-7" x2="12" y2="7" stroke="#BACBFF" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- Loop -->
      <g transform="translate(130, 0)">
        <path d="M-7 -4 C-7 -7 -3 -8 0 -8 C4 -8 7 -5 7 -1 L7 1 M7 4 C7 7 3 8 0 8 C-4 8 -7 5 -7 1 L-7 -1" stroke="#F5A9B8" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <path d="M4 -3 L7 0 L10 -3" stroke="#F5A9B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M-4 3 L-7 0 L-10 3" stroke="#F5A9B8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
    </g>
  </g>
</svg>
