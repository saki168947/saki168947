<svg width="960" height="300" viewBox="0 0 960 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lovesLightTitle lovesLightDesc">
  <title id="lovesLightTitle">୨୧ Character and Melodies Bento Card (Light Pastel) ୨୧</title>
  <desc id="lovesLightDesc">A dreamy pastel Ave Mujica bento card showcasing character devotion and favorite treasures designed to blend seamlessly with GitHub Light Mode.</desc>

  <defs>
    <!-- Soft Dreamy Pastel Base Gradient -->
    <linearGradient id="pastelSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF3FD"/>
      <stop offset="35%" stop-color="#F4ECF8"/>
      <stop offset="70%" stop-color="#FDF1F5"/>
      <stop offset="100%" stop-color="#ECF4FE"/>
    </linearGradient>

    <!-- Card Border -->
    <linearGradient id="cardBorderLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8A5B7" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#7EB4FA" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Shooting Star Gradient -->
    <linearGradient id="meteorLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="60%" stop-color="#EC4899" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="1"/>
    </linearGradient>

    <!-- Cloud Blur Filter -->
    <filter id="cloudBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>

    <!-- Card Elevation Shadow -->
    <filter id="cardElevation" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#9CB3DB" flood-opacity="0.2"/>
    </filter>

    <!-- Mini Card Shadow -->
    <filter id="miniBoxShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#BACBFF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Card Base with Soft Elevation Shadow -->
  <g filter="url(#cardElevation)">
    <rect x="2" y="2" width="956" height="296" rx="22" fill="url(#pastelSky)"/>
  </g>

  <!-- DYNAMIC BACKGROUND LAYER: Breathing Pastel Nebulas -->
  <g filter="url(#cloudBlur)">
    <circle cx="220" cy="160" r="140" fill="#FBA6B9" opacity="0.45">
      <animate attributeName="opacity" values="0.35; 0.55; 0.35" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="220; 250; 220" dur="9.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="140" r="135" fill="#72B5F8" opacity="0.45">
      <animate attributeName="opacity" values="0.35; 0.55; 0.35" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="740; 700; 740" dur="8.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Frosted Glass White Overlay -->
  <rect x="2" y="2" width="956" height="296" rx="22" fill="#FFFFFF" fill-opacity="0.35"/>

  <!-- Shooting Star in Bento Card 2 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0; 0; 0.85; 0.85; 0; 0" keyTimes="0; 0.35; 0.4; 0.6; 0.65; 1" dur="9s" repeatCount="indefinite"/>
    <line x1="680" y1="20" x2="800" y2="75" stroke="url(#meteorLight)" stroke-width="2" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="-150 -70; 240 110" dur="9s" repeatCount="indefinite"/>
    </line>
    <circle cx="800" cy="75" r="2.5" fill="#EC4899">
      <animateTransform attributeName="transform" type="translate" values="-150 -70; 240 110" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Twinkling Starlight Particles -->
  <g fill="#EC4899">
    <circle cx="95" cy="45" r="1.8">
      <animate attributeName="opacity" values="0.25; 1; 0.25" dur="2.3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1.3; 2.5; 1.3" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="440" cy="40" r="1.6" fill="#3B82F6">
      <animate attributeName="opacity" values="0.2; 0.95; 0.2" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="530" cy="265" r="2" fill="#8B5CF6">
      <animate attributeName="opacity" values="0.25; 1; 0.25" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="920" cy="70" r="1.8" fill="#3B82F6">
      <animate attributeName="opacity" values="0.25; 1; 0.25" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="890" cy="245" r="1.9">
      <animate attributeName="opacity" values="0.2; 0.9; 0.2" dur="3.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="260" r="1.6" fill="#3B82F6">
      <animate attributeName="opacity" values="0.2; 0.85; 0.2" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- Tiny Sparkle -->
    <g transform="translate(460, 50)">
      <path d="M0 -6 L1.5 -1.5 L6 0 L1.5 1.5 L0 6 L-1.5 1.5 L-6 0 L-1.5 -1.5 Z" fill="#3B82F6">
        <animate attributeName="opacity" values="0.3; 0.95; 0.3" dur="2.8s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Luminous Animated Border -->
  <rect x="1" y="1" width="958" height="298" rx="21" stroke="url(#cardBorderLight)" stroke-width="1.8">
    <animate attributeName="stroke-opacity" values="0.7; 1; 0.7" dur="3.4s" repeatCount="indefinite"/>
  </rect>

  <!-- Center Divider Line with Twinkling Starlight Bead -->
  <line x1="480" y1="28" x2="480" y2="272" stroke="#C4D5F2" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="480" cy="150" r="3.5" fill="#EC4899">
    <animate attributeName="opacity" values="0.6; 1; 0.6" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Left Column: Character & Oblivionis (Cute Typography) -->
  <g transform="translate(40, 30)">
    <!-- Header (Cute Italic + Ribbon) -->
    <text x="0" y="18" fill="#0F172A" font-size="18" font-weight="700" font-style="italic" letter-spacing="1" font-family="'Palatino Linotype', 'Georgia', 'PingFang SC', sans-serif">
      ୨୧ favorite character <tspan fill="#BE185D" font-size="13.5" font-style="normal" font-weight="600" letter-spacing="0.5">· 角色与作品 ୨୧</tspan>
    </text>

    <!-- Content Items -->
    <g transform="translate(0, 46)">
      <!-- Item 1: Sakiko Identity -->
      <g>
        <text x="0" y="4" fill="#0F172A" font-size="16.5" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
          🌙 丰川祥子 <tspan fill="#2563EB" font-size="13.5" font-weight="600">(Togawa Sakiko)</tspan>
        </text>
        <text x="0" y="26" fill="#BE185D" font-size="12.5" font-style="italic" font-weight="600" font-family="'Palatino Linotype', 'Georgia', sans-serif">
          ♡ 《BanG Dream! It's MyGO!!!!!》 &amp; 《Ave Mujica》 ♡
        </text>
      </g>

      <!-- Mini Box: Oblivionis Persona (Frosted White Glass) -->
      <g transform="translate(0, 44)" filter="url(#miniBoxShadow)">
        <rect x="0" y="0" width="400" height="110" rx="14" fill="#FFFFFF" fill-opacity="0.9" stroke="#F9A8D4" stroke-width="1.2"/>
        <text x="16" y="28" fill="#BE185D" font-size="13.5" font-weight="700" letter-spacing="0.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
          🎹 偏爱角色 · Togawa Sakiko
        </text>
        <text x="16" y="54" fill="#334155" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
          超高规格的建模喵。这真好看喵，而且性格好玩喵，声音也好听喵。
        </text>
        <text x="16" y="82" fill="#2563EB" font-size="13" font-style="italic" font-weight="600" font-family="'Palatino Linotype', 'Georgia', 'PingFang SC', serif">
          “ 🐘 🥒  🐕 ✨ ”
        </text>
      </g>
    </g>
  </g>

  <!-- Right Column: Loves & Melodies (Cute Typography) -->
  <g transform="translate(520, 30)">
    <!-- Header (Cute Italic + Heart) -->
    <text x="0" y="18" fill="#0F172A" font-size="18" font-weight="700" font-style="italic" letter-spacing="1" font-family="'Palatino Linotype', 'Georgia', 'PingFang SC', sans-serif">
      ♡ melodies &amp; life <tspan fill="#2563EB" font-size="13.5" font-style="normal" font-weight="600" letter-spacing="0.5">· 偏好与日常 ♡</tspan>
    </text>

    <!-- Content Items -->
    <g transform="translate(0, 46)">
      <!-- Item 1: Music -->
      <g transform="translate(0, 6)">
        <text x="0" y="0" fill="#334155" font-size="14.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
          <tspan fill="#BE185D" font-weight="700">🎵 歌单常驻：</tspan>《夏恋》、《春日影》、有刺无刺的歌
        </text>
      </g>

      <!-- Item 2: Ice Cream -->
      <g transform="translate(0, 40)">
        <text x="0" y="0" fill="#334155" font-size="14.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
          <tspan fill="#BE185D" font-weight="700">🍨 偏好甜品：</tspan>香草与草莓冰淇淋
        </text>
      </g>

      <!-- Item 3: Night coding -->
      <g transform="translate(0, 74)">
        <text x="0" y="0" fill="#334155" font-size="14.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
          <tspan fill="#BE185D" font-weight="700">💻 日常状态：</tspan>睡觉睡觉睡觉睡觉
        </text>
      </g>

      <!-- Item 4: Life treasures -->
      <g transform="translate(0, 108)">
        <text x="0" y="0" fill="#334155" font-size="14.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
          <tspan fill="#BE185D" font-weight="700">✨ 探索发现：</tspan>给木给木给木 ♡
        </text>
      </g>
    </g>
  </g>
</svg>
