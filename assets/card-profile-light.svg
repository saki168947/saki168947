<svg width="960" height="300" viewBox="0 0 960 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="profileLightTitle profileLightDesc">
  <title id="profileLightTitle">୨୧ About Me and Tech Stack Bento Card (Light Pastel) ୨୧</title>
  <desc id="profileLightDesc">A dreamy pastel Ave Mujica bento card showcasing identity, time series analysis, and tech stack designed to blend seamlessly with GitHub Light Mode.</desc>

  <defs>
    <!-- Soft Dreamy Pastel Base Gradient -->
    <linearGradient id="pastelSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF3FD"/>
      <stop offset="35%" stop-color="#F4ECF8"/>
      <stop offset="70%" stop-color="#FDF1F5"/>
      <stop offset="100%" stop-color="#ECF4FE"/>
    </linearGradient>

    <!-- Card Border -->
    <linearGradient id="cardBorderLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7EB4FA" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F8A5B7" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Shooting Star Gradient -->
    <linearGradient id="meteorLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5BCEFA" stop-opacity="0"/>
      <stop offset="60%" stop-color="#EC4899" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#2B7DE9" stop-opacity="1"/>
    </linearGradient>

    <!-- Cloud Blur Filter -->
    <filter id="cloudBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>

    <!-- Card Elevation Shadow -->
    <filter id="cardElevation" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#9CB3DB" flood-opacity="0.2"/>
    </filter>

    <!-- Skill Tile Shadow -->
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#BACBFF" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Card Base with Soft Elevation Shadow -->
  <g filter="url(#cardElevation)">
    <rect x="2" y="2" width="956" height="296" rx="22" fill="url(#pastelSky)"/>
  </g>

  <!-- DYNAMIC BACKGROUND LAYER: Breathing Pastel Nebulas -->
  <g filter="url(#cloudBlur)">
    <circle cx="180" cy="150" r="140" fill="#72B5F8" opacity="0.45">
      <animate attributeName="opacity" values="0.35; 0.55; 0.35" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="180; 220; 180" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="160" r="140" fill="#FBA6B9" opacity="0.45">
      <animate attributeName="opacity" values="0.35; 0.55; 0.35" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="780; 740; 780" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Frosted Glass White Overlay -->
  <rect x="2" y="2" width="956" height="296" rx="22" fill="#FFFFFF" fill-opacity="0.35"/>

  <!-- Shooting Star in Light Bento Card 1 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0; 0; 0.85; 0.85; 0; 0" keyTimes="0; 0.45; 0.5; 0.7; 0.75; 1" dur="8.5s" repeatCount="indefinite"/>
    <line x1="280" y1="15" x2="400" y2="70" stroke="url(#meteorLight)" stroke-width="2" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="-150 -70; 240 110" dur="8.5s" repeatCount="indefinite"/>
    </line>
    <circle cx="400" cy="70" r="2.5" fill="#2B7DE9">
      <animateTransform attributeName="transform" type="translate" values="-150 -70; 240 110" dur="8.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Twinkling Starlight Particles -->
  <g fill="#3B82F6">
    <circle cx="80" cy="40" r="1.8">
      <animate attributeName="opacity" values="0.25; 1; 0.25" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1.3; 2.5; 1.3" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="430" cy="50" r="1.6" fill="#EC4899">
      <animate attributeName="opacity" values="0.2; 0.9; 0.2" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="510" cy="260" r="2" fill="#8B5CF6">
      <animate attributeName="opacity" values="0.25; 1; 0.25" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="910" cy="60" r="1.8" fill="#EC4899">
      <animate attributeName="opacity" values="0.25; 0.95; 0.25" dur="2.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="240" r="2" fill="#3B82F6">
      <animate attributeName="opacity" values="0.2; 0.85; 0.2" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="270" r="1.6" fill="#EC4899">
      <animate attributeName="opacity" values="0.25; 1; 0.25" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Tiny Sparkle -->
    <g transform="translate(460, 250)">
      <path d="M0 -6 L1.5 -1.5 L6 0 L1.5 1.5 L0 6 L-1.5 1.5 L-6 0 L-1.5 -1.5 Z" fill="#EC4899">
        <animate attributeName="opacity" values="0.3; 0.95; 0.3" dur="2.6s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Luminous Animated Border -->
  <rect x="1" y="1" width="958" height="298" rx="21" stroke="url(#cardBorderLight)" stroke-width="1.8">
    <animate attributeName="stroke-opacity" values="0.7; 1; 0.7" dur="3.6s" repeatCount="indefinite"/>
  </rect>

  <!-- Subtle Center Column Divider with Starlight Bead -->
  <line x1="480" y1="28" x2="480" y2="272" stroke="#C4D5F2" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="480" cy="150" r="3.5" fill="#3B82F6">
    <animate attributeName="opacity" values="0.6; 1; 0.6" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Left Column: About Me (Cute Typography) -->
  <g transform="translate(40, 30)">
    <!-- Header (Cute Italic + Ribbon) -->
    <text x="0" y="18" fill="#0F172A" font-size="18" font-weight="700" font-style="italic" letter-spacing="1" font-family="'Palatino Linotype', 'Georgia', 'PingFang SC', sans-serif">
      ୨୧ about me <tspan fill="#2563EB" font-size="13.5" font-style="normal" font-weight="600" letter-spacing="0.5">· 关于我 ୨୧</tspan>
    </text>

    <!-- Content Items in Adorable Layout -->
    <g transform="translate(0, 48)">
      <!-- Item 1 -->
      <text x="0" y="0" fill="#334155" font-size="14.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
        <tspan fill="#BE185D" font-weight="700">🌷 你好呀：</tspan>我是 <tspan fill="#0F172A" font-weight="700">小花凉ovo</tspan> <tspan fill="#2563EB" font-weight="600">（Saki）</tspan>
      </text>

      <!-- Item 2 -->
      <text x="0" y="28" fill="#334155" font-size="14.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
        <tspan fill="#BE185D" font-weight="700">🎀 目前身份：</tspan>在读学生   不想上学QAQ
      </text>



      <!-- Item 4: Philosophy Quote Mini-Card (Frosted White Glass) -->
      <g transform="translate(0, 80)" filter="url(#tileShadow)">
        <rect x="0" y="0" width="400" height="74" rx="14" fill="#FFFFFF" fill-opacity="0.9" stroke="#93C5FD" stroke-width="1.2"/>
        <text x="16" y="24" fill="#2563EB" font-size="11.5" font-weight="700" letter-spacing="1" font-family="'Palatino Linotype', 'Georgia', sans-serif">
          ✨ 囊囊囊囊囊囊囊囊囊囊
        </text>
        <text x="16" y="50" fill="#BE185D" font-size="13.5" font-style="italic" font-weight="600" font-family="'Palatino Linotype', 'Georgia', 'PingFang SC', 'Microsoft YaHei', sans-serif">
          “ 莲瓣入水而不苦根茎  勿执着  ”
        </text>
      </g>
    </g>
  </g>

  <!-- Right Column: Tech Stack & Skills (Cute Typography) -->
  <g transform="translate(520, 30)">
    <!-- Header (Cute Italic + Heart) -->
    <text x="0" y="18" fill="#0F172A" font-size="18" font-weight="700" font-style="italic" letter-spacing="1" font-family="'Palatino Linotype', 'Georgia', 'PingFang SC', sans-serif">
      ♡ tech stack <tspan fill="#BE185D" font-size="13.5" font-style="normal" font-weight="600" letter-spacing="0.5">· 常用技术栈 ♡</tspan>
    </text>

    <!-- Skill Cards Grid with Cute Rounded Frosted Pills -->
    <g transform="translate(0, 42)">
      <!-- Skill 1: Rust -->
      <g transform="translate(0, 0)" filter="url(#tileShadow)">
        <rect x="0" y="0" width="190" height="52" rx="12" fill="#FFFFFF" fill-opacity="0.92" stroke="#93C5FD" stroke-width="1.2"/>
        <text x="16" y="24" fill="#B91C1C" font-size="14.5" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
          🦀 Rust
        </text>
        <text x="16" y="42" fill="#475569" font-size="11" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
          高性能 · 内存安全探索
        </text>
      </g>

      <!-- Skill 2: Python -->
      <g transform="translate(205, 0)" filter="url(#tileShadow)">
        <rect x="0" y="0" width="190" height="52" rx="12" fill="#FFFFFF" fill-opacity="0.92" stroke="#BACBFF" stroke-width="1.2"/>
        <text x="16" y="24" fill="#1D4ED8" font-size="14.5" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
          🐍 Python
        </text>
        <text x="16" y="42" fill="#475569" font-size="11" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
          数据分析 · 机器学习建模
        </text>
      </g>

      <!-- Skill 3: Time Series -->
      <g transform="translate(0, 64)" filter="url(#tileShadow)">
        <rect x="0" y="0" width="190" height="52" rx="12" fill="#FFFFFF" fill-opacity="0.92" stroke="#A78BFA" stroke-width="1.2"/>
        <text x="16" y="24" fill="#4338CA" font-size="14.5" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
          📊 Time Series
        </text>
        <text x="16" y="42" fill="#475569" font-size="11" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
          时间序列规律与预测
        </text>
      </g>

      <!-- Skill 4: Tools -->
      <g transform="translate(205, 64)" filter="url(#tileShadow)">
        <rect x="0" y="0" width="190" height="52" rx="12" fill="#FFFFFF" fill-opacity="0.92" stroke="#F9A8D4" stroke-width="1.2"/>
        <text x="16" y="24" fill="#BE185D" font-size="14.5" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
          💻 Dev Tools
        </text>
        <text x="16" y="42" fill="#475569" font-size="11" font-weight="500" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
          Git · VS Code · Markdown
        </text>
      </g>

      <!-- Bottom Note in Cute Italic -->
      <text x="4" y="145" fill="#4B6DAE" font-size="12" font-weight="600" font-style="italic" font-family="'Palatino Linotype', 'Georgia', 'PingFang SC', sans-serif">
        ✧ 专注数据挖掘、时间序列建模与高效工具开发 ✧
      </text>
    </g>
  </g>
</svg>
