<svg width="960" height="300" viewBox="0 0 960 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="lovesCardTitle lovesCardDesc">
  <title id="lovesCardTitle">୨୧ Character and Melodies Bento Card ୨୧</title>
  <desc id="lovesCardDesc">A dual-column card showcasing Togawa Sakiko character devotion and favorite melodies in an adorable Ave Mujica starlight aesthetic with animated twinkling stars, shooting stars, and glowing borders.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C1E"/>
      <stop offset="50%" stop-color="#121838"/>
      <stop offset="100%" stop-color="#19132E"/>
    </linearGradient>

    <!-- Card Border -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A9B8" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#BACBFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#5BCEFA" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Mini Card Background -->
    <linearGradient id="miniCardBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#281A3C" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#161E44" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Shooting Star Gradient -->
    <linearGradient id="meteorMini" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="60%" stop-color="#F5A9B8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card Base -->
  <rect width="960" height="300" rx="22" fill="url(#cardBg)"/>

  <!-- DYNAMIC BACKGROUND LAYER: Vivid Cosmic Breathing Nebulas -->
  <g filter="url(#softGlow)">
    <circle cx="220" cy="160" r="140" fill="#D95A8D" opacity="0.3">
      <animate attributeName="opacity" values="0.2; 0.42; 0.2" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="220; 250; 220" dur="9.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="740" cy="140" r="135" fill="#3B6CD4" opacity="0.32">
      <animate attributeName="opacity" values="0.22; 0.44; 0.22" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="740; 700; 740" dur="8.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Shooting Star in Bento Card 2 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0; 0; 0.9; 0.9; 0; 0" keyTimes="0; 0.35; 0.4; 0.6; 0.65; 1" dur="9s" repeatCount="indefinite"/>
    <line x1="680" y1="20" x2="800" y2="75" stroke="url(#meteorMini)" stroke-width="2" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="-150 -70; 240 110" dur="9s" repeatCount="indefinite"/>
    </line>
    <circle cx="800" cy="75" r="2.5" fill="#FCE4EC" filter="url(#starGlow)">
      <animateTransform attributeName="transform" type="translate" values="-150 -70; 240 110" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Twinkling Starlight Particles -->
  <g fill="#FFFFFF" filter="url(#starGlow)">
    <circle cx="95" cy="45" r="1.8">
      <animate attributeName="opacity" values="0.2; 1; 0.2" dur="2.3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1.2; 2.5; 1.2" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="440" cy="40" r="1.6">
      <animate attributeName="opacity" values="0.2; 0.95; 0.2" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="530" cy="265" r="2">
      <animate attributeName="opacity" values="0.15; 1; 0.15" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1.3; 2.6; 1.3" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="920" cy="70" r="1.8">
      <animate attributeName="opacity" values="0.2; 1; 0.2" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="890" cy="245" r="1.9">
      <animate attributeName="opacity" values="0.2; 0.9; 0.2" dur="3.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="110" cy="260" r="1.6">
      <animate attributeName="opacity" values="0.15; 0.85; 0.15" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- Tiny Sparkle -->
    <g transform="translate(460, 50)">
      <path d="M0 -6 L1.5 -1.5 L6 0 L1.5 1.5 L0 6 L-1.5 1.5 L-6 0 L-1.5 -1.5 Z" fill="#5BCEFA">
        <animate attributeName="opacity" values="0.3; 0.95; 0.3" dur="2.8s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Luminous Animated Border -->
  <rect x="1" y="1" width="958" height="298" rx="21" stroke="url(#cardBorder)" stroke-width="1.8">
    <animate attributeName="stroke-opacity" values="0.6; 1; 0.6" dur="3.4s" repeatCount="indefinite"/>
  </rect>

  <!-- Center Divider Line with Twinkling Starlight Bead -->
  <line x1="480" y1="28" x2="480" y2="272" stroke="#2D3864" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="480" cy="150" r="3.5" fill="#F5A9B8">
    <animate attributeName="opacity" values="0.5; 1; 0.5" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Left Column: Character & Oblivionis (Cute Typography) -->
  <g transform="translate(40, 30)">
    <!-- Header (Cute Italic + Ribbon) -->
    <text x="0" y="18" fill="#FFFFFF" font-size="18" font-weight="700" font-style="italic" letter-spacing="1" font-family="'Palatino Linotype', 'Georgia', 'PingFang SC', sans-serif">
      ୨୧ favorite character <tspan fill="#F5A9B8" font-size="13.5" font-style="normal" font-weight="500" letter-spacing="0.5">· 角色与作品 ୨୧</tspan>
    </text>

    <!-- Content Items -->
    <g transform="translate(0, 46)">
      <!-- Item 1: Sakiko Identity -->
      <g>
        <text x="0" y="4" fill="#FFFFFF" font-size="16.5" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
          🌙 丰川祥子 <tspan fill="#5BCEFA" font-size="13.5" font-weight="600">(Togawa Sakiko)</tspan>
        </text>
        <text x="0" y="26" fill="#BACBFF" font-size="12.5" font-style="italic" font-family="'Palatino Linotype', 'Georgia', sans-serif">
          ♡ 《BanG Dream! It's MyGO!!!!!》 &amp; 《Ave Mujica》 ♡
        </text>
      </g>

      <!-- Mini Box: Oblivionis Persona -->
      <g transform="translate(0, 44)">
        <rect x="0" y="0" width="400" height="110" rx="14" fill="url(#miniCardBg)" stroke="#F5A9B8" stroke-opacity="0.45" stroke-width="1.2"/>
        <text x="16" y="28" fill="#F5A9B8" font-size="13.5" font-weight="700" letter-spacing="0.8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
          🎹 偏爱角色 · Togawa Sakiko
        </text>
        <text x="16" y="54" fill="#EAF0FB" font-size="13" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
          超高规格的建模喵。这真好看喵，而且性格好玩喵，声音也好听喵。
        </text>
        <text x="16" y="82" fill="#BACBFF" font-size="13" font-style="italic" font-weight="600" font-family="'Palatino Linotype', 'Georgia', 'PingFang SC', serif">
          “ 🐘 🥒  🐕 ✨ ”
        </text>
      </g>
    </g>
  </g>

  <!-- Right Column: Loves & Melodies (Cute Typography) -->
  <g transform="translate(520, 30)">
    <!-- Header (Cute Italic + Heart) -->
    <text x="0" y="18" fill="#FFFFFF" font-size="18" font-weight="700" font-style="italic" letter-spacing="1" font-family="'Palatino Linotype', 'Georgia', 'PingFang SC', sans-serif">
      ♡ melodies &amp; life <tspan fill="#BACBFF" font-size="13.5" font-style="normal" font-weight="500" letter-spacing="0.5">· 偏好与日常 ♡</tspan>
    </text>

    <!-- Content Items -->
    <g transform="translate(0, 46)">
      <!-- Item 1: Music -->
      <g transform="translate(0, 6)">
        <text x="0" y="0" fill="#EAF0FB" font-size="14.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
          <tspan fill="#F5A9B8" font-weight="700">🎵 歌单常驻：</tspan>《夏恋》、《春日影》、有刺无刺的歌
        </text>
      </g>

      <!-- Item 2: Ice Cream -->
      <g transform="translate(0, 40)">
        <text x="0" y="0" fill="#EAF0FB" font-size="14.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
          <tspan fill="#F5A9B8" font-weight="700">🍨 偏好甜品：</tspan>香草与草莓冰淇淋
        </text>
      </g>

      <!-- Item 3: Night coding -->
      <g transform="translate(0, 74)">
        <text x="0" y="0" fill="#EAF0FB" font-size="14.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
          <tspan fill="#F5A9B8" font-weight="700">💻 日常状态：</tspan>睡觉睡觉睡觉睡觉
        </text>
      </g>

      <!-- Item 4: Life treasures -->
      <g transform="translate(0, 108)">
        <text x="0" y="0" fill="#EAF0FB" font-size="14.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
          <tspan fill="#F5A9B8" font-weight="700">✨ 探索发现：</tspan>给木给木给木 ♡
        </text>
      </g>
    </g>
  </g>
</svg>
