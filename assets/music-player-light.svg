<svg width="960" height="270" viewBox="0 0 960 270" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="playerLightTitle playerLightDesc">
  <title id="playerLightTitle">Now Playing: Natsukoi by Togawa Sakiko (Light Pastel)</title>
  <desc id="playerLightDesc">A dreamy pastel Ave Mujica themed music player widget designed to blend seamlessly with GitHub Light Mode.</desc>

  <defs>
    <!-- Soft Dreamy Pastel Base Gradient -->
    <linearGradient id="pastelSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF3FD"/>
      <stop offset="35%" stop-color="#F4ECF8"/>
      <stop offset="70%" stop-color="#FDF1F5"/>
      <stop offset="100%" stop-color="#ECF4FE"/>
    </linearGradient>

    <!-- Card Border -->
    <linearGradient id="playerBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7EB4FA" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#F8A5B7" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Vinyl Center Gradient -->
    <radialGradient id="vinylCenterLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCE4EC"/>
      <stop offset="45%" stop-color="#F472B6"/>
      <stop offset="100%" stop-color="#DB2777"/>
    </radialGradient>

    <!-- Progress Bar Gradient -->
    <linearGradient id="progressGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <filter id="cloudBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24"/>
    </filter>

    <filter id="cardElevation" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#9CB3DB" flood-opacity="0.2"/>
    </filter>

    <filter id="vinylElevation" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7B93BE" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Card Base with Soft Elevation Shadow -->
  <g filter="url(#cardElevation)">
    <rect x="2" y="2" width="956" height="266" rx="22" fill="url(#pastelSky)"/>
  </g>

  <!-- DYNAMIC LAYER 1: Breathing Pastel Nebulas -->
  <g filter="url(#cloudBlur)">
    <circle cx="200" cy="135" r="140" fill="#72B5F8" opacity="0.45">
      <animate attributeName="opacity" values="0.35; 0.55; 0.35" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="135" r="150" fill="#FBA6B9" opacity="0.45">
      <animate attributeName="opacity" values="0.35; 0.55; 0.35" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Frosted Glass Overlay -->
  <rect x="2" y="2" width="956" height="266" rx="22" fill="#FFFFFF" fill-opacity="0.35"/>

  <!-- Twinkling Starlight Particles -->
  <g fill="#3B82F6">
    <circle cx="330" cy="30" r="1.6">
      <animate attributeName="opacity" values="0.2; 0.9; 0.2" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="530" cy="25" r="1.8" fill="#EC4899">
      <animate attributeName="opacity" values="0.2; 1; 0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="790" cy="32" r="1.6" fill="#8B5CF6">
      <animate attributeName="opacity" values="0.2; 0.95; 0.2" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="910" cy="140" r="1.8" fill="#EC4899">
      <animate attributeName="opacity" values="0.15; 0.85; 0.15" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Luminous Animated Border -->
  <rect x="1" y="1" width="958" height="268" rx="21" stroke="url(#playerBorder)" stroke-width="1.8">
    <animate attributeName="stroke-opacity" values="0.7; 1; 0.7" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Left: Animated Rotating Luxury Vinyl Record -->
  <g transform="translate(135, 135)" filter="url(#vinylElevation)">
    <!-- Turntable White Mat Ring -->
    <circle cx="0" cy="0" r="98" fill="#FFFFFF" stroke="#BACBFF" stroke-width="1.2"/>

    <!-- Rotating Vinyl Body -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>

      <circle cx="0" cy="0" r="90" fill="#111827" stroke="#374151" stroke-width="1.8"/>

      <!-- Vinyl Grooves -->
      <circle cx="0" cy="0" r="82" stroke="#1F2937" stroke-width="1" stroke-dasharray="10 4" opacity="0.8"/>
      <circle cx="0" cy="0" r="74" stroke="#374151" stroke-width="0.8" opacity="0.6"/>
      <circle cx="0" cy="0" r="66" stroke="#1F2937" stroke-width="1" stroke-dasharray="14 5" opacity="0.6"/>
      <circle cx="0" cy="0" r="58" stroke="#374151" stroke-width="0.8" opacity="0.6"/>
      <circle cx="0" cy="0" r="50" stroke="#1F2937" stroke-width="0.8" stroke-dasharray="8 4" opacity="0.5"/>

      <!-- Surface Light Sheen -->
      <path d="M-65 -65 L-12 -12 A 86 86 0 0 1 65 -65 Z" fill="#FFFFFF" fill-opacity="0.1"/>
      <path d="M65 65 L12 12 A 86 86 0 0 1 -65 65 Z" fill="#FFFFFF" fill-opacity="0.1"/>

      <!-- Vinyl Center Label -->
      <circle cx="0" cy="0" r="36" fill="url(#vinylCenterLight)" stroke="#FFFFFF" stroke-width="1.5"/>

      <!-- Center Moon & Ave Mujica -->
      <path d="M-10 -12 C-3 -12 5 -6 5 4 C5 12 -3 18 -10 18 C-4 15 0 9 0 4 C0 -3 -4 -8 -10 -12 Z" fill="#FFFFFF" opacity="0.95"/>
      <circle cx="7" cy="-7" r="2.2" fill="#FFFFFF"/>
      <text x="0" y="25" fill="#FFFFFF" font-size="6.5" font-weight="700" letter-spacing="1" text-anchor="middle" font-family="'Cinzel', serif">
        AVE MUJICA
      </text>

      <!-- Spindle Hole -->
      <circle cx="0" cy="0" r="6.5" fill="#FFFFFF" stroke="#BACBFF" stroke-width="1.2"/>
    </g>
  </g>

  <!-- Static Tonearm -->
  <g transform="translate(135, 135)">
    <circle cx="96" cy="-94" r="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5"/>
    <circle cx="96" cy="-94" r="3.5" fill="#3B82F6"/>
    <line x1="96" y1="-88" x2="38" y2="-22" stroke="#4B5563" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="38" cy="-22" r="4" fill="#EC4899" stroke="#FFFFFF" stroke-width="1.2"/>
  </g>

  <!-- Floating Musical Notes -->
  <g>
    <g transform="translate(55, 70)">
      <animateTransform attributeName="transform" type="translate" values="55 70; 57 60; 55 52; 53 62; 55 70" dur="4.2s" repeatCount="indefinite"/>
      <text x="0" y="0" fill="#3B82F6" font-size="16" font-family="'Segoe UI Symbol', sans-serif">♪</text>
    </g>
    <g transform="translate(235, 60)">
      <animateTransform attributeName="transform" type="translate" values="235 60; 238 50; 235 42; 232 52; 235 60" dur="5.0s" repeatCount="indefinite"/>
      <text x="0" y="0" fill="#EC4899" font-size="18" font-family="'Segoe UI Symbol', sans-serif">♫</text>
    </g>
    <g transform="translate(220, 215)">
      <animateTransform attributeName="transform" type="translate" values="220 215; 222 205; 220 198; 218 206; 220 215" dur="4.6s" repeatCount="indefinite"/>
      <text x="0" y="0" fill="#8B5CF6" font-size="14" font-family="'Segoe UI Symbol', sans-serif">♡</text>
    </g>
  </g>

  <!-- Right: Track Info & Controls -->
  <g transform="translate(280, 36)">
    <!-- Top Pill -->
    <rect x="0" y="0" width="144" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.9" stroke="#72B5F8" stroke-width="1.2"/>
    <circle cx="16" cy="13" r="3.5" fill="#3B82F6">
      <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="r" values="3.5;4.5;3.5" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="28" y="17" fill="#1E3A8A" font-size="11" font-weight="700" letter-spacing="1.5" font-family="'Palatino Linotype', 'Georgia', sans-serif">
      NOW PLAYING
    </text>

    <!-- Genre & Hi-Res Badge -->
    <text x="156" y="18" fill="#BE185D" font-size="12" font-weight="600" letter-spacing="1" font-family="'Palatino Linotype', 'Georgia', sans-serif">
      ♡ Ave Mujica · Piano &amp; Strings · FLAC 96kHz/24bit ♡
    </text>

    <!-- Song Title -->
    <text x="0" y="64" fill="#0F172A" font-size="28" font-weight="700" font-style="italic" letter-spacing="1" font-family="'Palatino Linotype', 'Georgia', 'PingFang SC', sans-serif">
      《夏恋》 <tspan fill="#EC4899" font-size="20" font-weight="500">/ Natsukoi</tspan>
    </text>

    <!-- Artist Name -->
    <text x="0" y="92" fill="#3B82F6" font-size="15" font-weight="600" font-family="'Palatino Linotype', 'Georgia', 'PingFang SC', sans-serif">
      🌸 丰川祥子 (Togawa Sakiko) · Oblivionis
    </text>

    <!-- Lyric Snippet -->
    <text x="0" y="120" fill="#475569" font-size="14" font-style="italic" font-family="'Palatino Linotype', 'Georgia', 'Yu Mincho', serif">
      “ 夏の風がそっと、想い出を連れてくる… 忘れられない旋律 ✧ ”
    </text>

    <!-- Audio Waveform Visualizer (Animated Equalizer Bars) -->
    <g transform="translate(480, 42)" fill="url(#progressGradLight)">
      <rect x="0" y="14" width="3.5" height="16" rx="1.75">
        <animate attributeName="y" values="18;6;14;2;12;18" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="height" values="12;24;16;28;18;12" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="9" y="8" width="3.5" height="22" rx="1.75">
        <animate attributeName="y" values="8;20;6;16;4;8" dur="0.95s" repeatCount="indefinite"/>
        <animate attributeName="height" values="22;10;24;14;26;22" dur="0.95s" repeatCount="indefinite"/>
      </rect>
      <rect x="18" y="2" width="3.5" height="28" rx="1.75">
        <animate attributeName="y" values="2;16;4;22;8;2" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="height" values="28;14;26;8;22;28" dur="1.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="27" y="10" width="3.5" height="20" rx="1.75">
        <animate attributeName="y" values="12;4;18;8;2;12" dur="1.05s" repeatCount="indefinite"/>
        <animate attributeName="height" values="18;26;12;22;28;18" dur="1.05s" repeatCount="indefinite"/>
      </rect>
      <rect x="36" y="16" width="3.5" height="14" rx="1.75">
        <animate attributeName="y" values="16;8;22;10;4;16" dur="0.85s" repeatCount="indefinite"/>
        <animate attributeName="height" values="14;22;8;20;26;14" dur="0.85s" repeatCount="indefinite"/>
      </rect>
      <rect x="45" y="4" width="3.5" height="26" rx="1.75">
        <animate attributeName="y" values="4;18;8;24;6;4" dur="1.15s" repeatCount="indefinite"/>
        <animate attributeName="height" values="26;12;22;6;24;26" dur="1.15s" repeatCount="indefinite"/>
      </rect>
      <rect x="54" y="8" width="3.5" height="22" rx="1.75">
        <animate attributeName="y" values="8;22;4;16;10;8" dur="1.4s" repeatCount="indefinite"/>
        <animate attributeName="height" values="22;8;26;14;20;22" dur="1.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="63" y="14" width="3.5" height="16" rx="1.75">
        <animate attributeName="y" values="14;4;18;6;20;14" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="height" values="16;26;12;24;10;16" dur="0.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="72" y="3" width="3.5" height="27" rx="1.75">
        <animate attributeName="y" values="3;15;8;22;4;3" dur="1.25s" repeatCount="indefinite"/>
        <animate attributeName="height" values="27;15;22;8;26;27" dur="1.25s" repeatCount="indefinite"/>
      </rect>
      <rect x="81" y="9" width="3.5" height="21" rx="1.75">
        <animate attributeName="y" values="9;21;6;14;3;9" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="height" values="21;9;24;16;27;21" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="90" y="15" width="3.5" height="15" rx="1.75">
        <animate attributeName="y" values="15;5;20;8;2;15" dur="1.35s" repeatCount="indefinite"/>
        <animate attributeName="height" values="15;25;10;22;28;15" dur="1.35s" repeatCount="indefinite"/>
      </rect>
      <rect x="99" y="7" width="3.5" height="23" rx="1.75">
        <animate attributeName="y" values="7;19;4;16;8;7" dur="0.8s" repeatCount="indefinite"/>
        <animate attributeName="height" values="23;11;26;14;22;23" dur="0.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="108" y="13" width="3.5" height="17" rx="1.75">
        <animate attributeName="y" values="13;3;17;7;21;13" dur="1.0s" repeatCount="indefinite"/>
        <animate attributeName="height" values="17;27;13;23;9;17" dur="1.0s" repeatCount="indefinite"/>
      </rect>
      <rect x="117" y="5" width="3.5" height="25" rx="1.75">
        <animate attributeName="y" values="5;17;8;23;6;5" dur="1.2s" repeatCount="indefinite"/>
        <animate attributeName="height" values="25;13;22;7;24;25" dur="1.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="126" y="16" width="3.5" height="14" rx="1.75">
        <animate attributeName="y" values="16;6;20;10;4;16" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="height" values="14;24;10;20;26;14" dur="0.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="135" y="10" width="3.5" height="20" rx="1.75">
        <animate attributeName="y" values="10;22;5;18;8;10" dur="1.15s" repeatCount="indefinite"/>
        <animate attributeName="height" values="20;8;25;12;22;20" dur="1.15s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Progress Bar Section -->
    <g transform="translate(0, 144)">
      <text x="0" y="8" fill="#4B5563" font-size="12" font-family="'SF Mono', 'Consolas', monospace">01:28</text>
      <rect x="48" y="1" width="510" height="5" rx="2.5" fill="#E2E8F0"/>
      <rect x="48" y="1" width="194" height="5" rx="2.5" fill="url(#progressGradLight)"/>
      <circle cx="242" cy="3.5" r="6" fill="#FFFFFF" stroke="#EC4899" stroke-width="2"/>
      <text x="570" y="8" fill="#94A3B8" font-size="12" font-family="'SF Mono', 'Consolas', monospace">03:45</text>
    </g>

    <!-- Player Controls Row -->
    <g transform="translate(250, 185)">
      <!-- Shuffle -->
      <g transform="translate(-130, 0)">
        <path d="M-8 -6 L-2 -6 L4 4 L8 4 M8 1 L11 4 L8 7 M-8 4 L-5 4 L-3 1 M3 -3 L5 -6 L8 -6 M8 -9 L11 -6 L8 -3" stroke="#64748B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>

      <!-- Previous Track -->
      <g transform="translate(-65, 0)" fill="#475569">
        <path d="M-10 0 L-2 -7 L-2 -1 L6 -7 L6 7 L-2 1 L-2 7 Z"/>
        <line x1="-12" y1="-7" x2="-12" y2="7" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- Play / Pause Circle -->
      <g transform="translate(0, 0)">
        <circle cx="0" cy="0" r="21" fill="url(#progressGradLight)"/>
        <rect x="-6" y="-9" width="4.5" height="18" rx="2" fill="#FFFFFF"/>
        <rect x="2.5" y="-9" width="4.5" height="18" rx="2" fill="#FFFFFF"/>
      </g>

      <!-- Next Track -->
      <g transform="translate(65, 0)" fill="#475569">
        <path d="M10 0 L2 -7 L2 -1 L-6 -7 L-6 7 L2 1 L2 7 Z"/>
        <line x1="12" y1="-7" x2="12" y2="7" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
      </g>

      <!-- Loop -->
      <g transform="translate(130, 0)">
        <path d="M-7 -4 C-7 -7 -3 -8 0 -8 C4 -8 7 -5 7 -1 L7 1 M7 4 C7 7 3 8 0 8 C-4 8 -7 5 -7 1 L-7 -1" stroke="#EC4899" stroke-width="1.8" stroke-linecap="round" fill="none"/>
        <path d="M4 -3 L7 0 L10 -3" stroke="#EC4899" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        <path d="M-4 3 L-7 0 L-10 3" stroke="#EC4899" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </g>
    </g>
  </g>
</svg>
