<svg width="960" height="36" viewBox="0 0 960 36" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Celestial moon and star divider (Light Pastel)">
  <defs>
    <linearGradient id="lineGradLeftLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0"/>
      <stop offset="30%" stop-color="#3B82F6" stop-opacity="0.6"/>
      <stop offset="70%" stop-color="#8B5CF6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="lineGradRightLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#F43F5E" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#FB7185" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FB7185" stop-opacity="0"/>
    </linearGradient>

    <filter id="softShadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#9CB3DB" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Left Horizontal Gradient Line -->
  <line x1="60" y1="18" x2="410" y2="18" stroke="url(#lineGradLeftLight)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="410" cy="18" r="3" fill="#3B82F6">
    <animate attributeName="r" values="2.5;3.5;2.5" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Right Horizontal Gradient Line -->
  <line x1="550" y1="18" x2="900" y2="18" stroke="url(#lineGradRightLight)" stroke-width="2" stroke-linecap="round"/>
  <circle cx="550" cy="18" r="3" fill="#EC4899">
    <animate attributeName="r" values="2.5;3.5;2.5" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Center Celestial Constellation Cluster -->
  <g transform="translate(480, 18)" filter="url(#softShadowLight)">
    <!-- Crescent Moon Center with Pulse -->
    <path d="M-9 -12 C-1 -12 6 -6 6 1 C6 8 -1 14 -9 14 C-3 10 0 6 0 1 C0 -4 -3 -8 -9 -12 Z" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.2">
      <animate attributeName="opacity" values="0.85; 1; 0.85" dur="3s" repeatCount="indefinite"/>
    </path>
    <circle cx="5" cy="-8" r="2.2" fill="#EC4899"/>

    <!-- Inner Twin Sparkle Stars with Twinkle -->
    <path d="M-34 -6 L-31 0 L-25 2 L-31 4 L-34 10 L-37 4 L-43 2 L-37 0 Z" fill="#3B82F6">
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M34 -6 L37 0 L43 2 L37 4 L34 10 L31 4 L25 2 L31 0 Z" fill="#EC4899">
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="2.2s" repeatCount="indefinite"/>
    </path>

    <!-- Outer Satellite Beads -->
    <circle cx="-58" cy="1" r="2.5" fill="#3B82F6"/>
    <circle cx="58" cy="1" r="2.5" fill="#EC4899"/>
  </g>
</svg>
