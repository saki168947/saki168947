<svg width="960" height="36" viewBox="0 0 960 36" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Celestial moon and star divider">
  <defs>
    <linearGradient id="lineGradLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4A7BD5" stop-opacity="0"/>
      <stop offset="30%" stop-color="#4A7BD5" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#5BCEFA" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#BACBFF" stop-opacity="1"/>
    </linearGradient>

    <linearGradient id="lineGradRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5A9B8" stop-opacity="1"/>
      <stop offset="30%" stop-color="#E56A97" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#D44D80" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#D44D80" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2.5" flood-color="#0E1638" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Left Horizontal Gradient Line -->
  <line x1="60" y1="18" x2="410" y2="18" stroke="url(#lineGradLeft)" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="410" cy="18" r="3" fill="#5BCEFA">
    <animate attributeName="r" values="2.5;3.5;2.5" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Right Horizontal Gradient Line -->
  <line x1="550" y1="18" x2="900" y2="18" stroke="url(#lineGradRight)" stroke-width="2.2" stroke-linecap="round"/>
  <circle cx="550" cy="18" r="3" fill="#F5A9B8">
    <animate attributeName="r" values="2.5;3.5;2.5" dur="2.2s" repeatCount="indefinite"/>
  </circle>

  <!-- Center Celestial Constellation Cluster -->
  <g transform="translate(480, 18)" filter="url(#shadowGlow)">
    <!-- Crescent Moon Center with Pulse -->
    <path d="M-9 -12 C-1 -12 6 -6 6 1 C6 8 -1 14 -9 14 C-3 10 0 6 0 1 C0 -4 -3 -8 -9 -12 Z" fill="#F8FAFF" stroke="#BACBFF" stroke-width="0.8">
      <animate attributeName="opacity" values="0.75; 1; 0.75" dur="3s" repeatCount="indefinite"/>
    </path>
    <circle cx="5" cy="-8" r="2.2" fill="#FCE4EC"/>

    <!-- Inner Twin Sparkle Stars with Twinkle -->
    <path d="M-34 -6 L-31 0 L-25 2 L-31 4 L-34 10 L-37 4 L-43 2 L-37 0 Z" fill="#5BCEFA">
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <path d="M34 -6 L37 0 L43 2 L37 4 L34 10 L31 4 L25 2 L31 0 Z" fill="#F5A9B8">
      <animate attributeName="opacity" values="0.4; 1; 0.4" dur="2.2s" repeatCount="indefinite"/>
    </path>

    <!-- Outer Satellite Beads -->
    <circle cx="-58" cy="1" r="2.5" fill="#4A7BD5"/>
    <circle cx="58" cy="1" r="2.5" fill="#D44D80"/>
  </g>
</svg>
