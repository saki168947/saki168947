<svg width="960" height="300" viewBox="0 0 960 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="profileCardTitle profileCardDesc">
  <title id="profileCardTitle">୨୧ About Me and Tech Stack Bento Card ୨୧</title>
  <desc id="profileCardDesc">A dual-column card showcasing profile identity, time series analysis, and tech stack in an adorable Ave Mujica starlight aesthetic with animated twinkling stars, shooting stars, and glowing borders.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C1E"/>
      <stop offset="50%" stop-color="#121838"/>
      <stop offset="100%" stop-color="#18132E"/>
    </linearGradient>

    <!-- Card Border -->
    <linearGradient id="cardBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5BCEFA" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#BACBFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F5A9B8" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Mini Card Background -->
    <linearGradient id="miniCardBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161E44" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#281C40" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Shooting Star Gradient -->
    <linearGradient id="meteorMini" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="60%" stop-color="#BACBFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Card Base -->
  <rect width="960" height="300" rx="22" fill="url(#cardBg)"/>

  <!-- DYNAMIC BACKGROUND LAYER: Vivid Cosmic Breathing Nebulas -->
  <g filter="url(#softGlow)">
    <circle cx="180" cy="150" r="140" fill="#3B6CD4" opacity="0.32">
      <animate attributeName="opacity" values="0.22; 0.42; 0.22" dur="6.5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="180; 220; 180" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="160" r="140" fill="#D95A8D" opacity="0.28">
      <animate attributeName="opacity" values="0.18; 0.38; 0.18" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="cx" values="780; 740; 780" dur="10s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Shooting Star in Bento Card 1 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0; 0; 0.9; 0.9; 0; 0" keyTimes="0; 0.45; 0.5; 0.7; 0.75; 1" dur="8.5s" repeatCount="indefinite"/>
    <line x1="280" y1="15" x2="400" y2="70" stroke="url(#meteorMini)" stroke-width="2" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="-150 -70; 240 110" dur="8.5s" repeatCount="indefinite"/>
    </line>
    <circle cx="400" cy="70" r="2.5" fill="#FFFFFF" filter="url(#starGlow)">
      <animateTransform attributeName="transform" type="translate" values="-150 -70; 240 110" dur="8.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Twinkling Starlight Particles -->
  <g fill="#FFFFFF" filter="url(#starGlow)">
    <circle cx="80" cy="40" r="1.8">
      <animate attributeName="opacity" values="0.2; 1; 0.2" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1.2; 2.4; 1.2" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="430" cy="50" r="1.6">
      <animate attributeName="opacity" values="0.1; 0.9; 0.1" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="510" cy="260" r="2">
      <animate attributeName="opacity" values="0.2; 1; 0.2" dur="2.7s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1.4; 2.6; 1.4" dur="2.7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="910" cy="60" r="1.8">
      <animate attributeName="opacity" values="0.2; 0.95; 0.2" dur="2.0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="240" r="2">
      <animate attributeName="opacity" values="0.15; 0.85; 0.15" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="120" cy="270" r="1.6">
      <animate attributeName="opacity" values="0.2; 1; 0.2" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <!-- Tiny Sparkle -->
    <g transform="translate(460, 250)">
      <path d="M0 -6 L1.5 -1.5 L6 0 L1.5 1.5 L0 6 L-1.5 1.5 L-6 0 L-1.5 -1.5 Z" fill="#F5A9B8">
        <animate attributeName="opacity" values="0.3; 0.95; 0.3" dur="2.6s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Luminous Animated Border -->
  <rect x="1" y="1" width="958" height="298" rx="21" stroke="url(#cardBorder)" stroke-width="1.8">
    <animate attributeName="stroke-opacity" values="0.6; 1; 0.6" dur="3.6s" repeatCount="indefinite"/>
  </rect>

  <!-- Subtle Center Column Divider with Starlight Bead -->
  <line x1="480" y1="28" x2="480" y2="272" stroke="#2D3864" stroke-width="1.2" stroke-dasharray="4 4"/>
  <circle cx="480" cy="150" r="3.5" fill="#5BCEFA">
    <animate attributeName="opacity" values="0.5; 1; 0.5" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Left Column: About Me (Cute Typography) -->
  <g transform="translate(40, 30)">
    <!-- Header (Cute Italic + Ribbon) -->
    <text x="0" y="18" fill="#FFFFFF" font-size="18" font-weight="700" font-style="italic" letter-spacing="1" font-family="'Palatino Linotype', 'Georgia', 'PingFang SC', sans-serif">
      ୨୧ about me <tspan fill="#BACBFF" font-size="13.5" font-style="normal" font-weight="500" letter-spacing="0.5">· 关于我 ୨୧</tspan>
    </text>

    <!-- Content Items in Adorable Layout -->
    <g transform="translate(0, 48)">
      <!-- Item 1 -->
      <text x="0" y="0" fill="#EAF0FB" font-size="14.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
        <tspan fill="#F5A9B8" font-weight="700">🌷 你好呀：</tspan>我是 <tspan fill="#FFFFFF" font-weight="700">小花凉ovo</tspan> <tspan fill="#5BCEFA">（Saki）</tspan>
      </text>

      <!-- Item 2 -->
      <text x="0" y="28" fill="#EAF0FB" font-size="14.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
        <tspan fill="#F5A9B8" font-weight="700">🎀 目前身份：</tspan>在读学生   不想上学QAQ
      </text>



      <!-- Item 4: Philosophy Quote Mini-Card -->
      <g transform="translate(0, 80)">
        <rect x="0" y="0" width="400" height="74" rx="14" fill="url(#miniCardBg)" stroke="#5BCEFA" stroke-opacity="0.45" stroke-width="1.2"/>
        <text x="16" y="24" fill="#5BCEFA" font-size="11.5" font-weight="700" letter-spacing="1" font-family="'Palatino Linotype', 'Georgia', sans-serif">
          ✨ 囊囊囊囊囊囊囊囊囊囊
        </text>
        <text x="16" y="50" fill="#FCE4EC" font-size="13.5" font-style="italic" font-weight="600" font-family="'Palatino Linotype', 'Georgia', 'PingFang SC', 'Microsoft YaHei', sans-serif">
          “ 莲瓣入水而不苦根茎  勿执着  ”
        </text>
      </g>
    </g>
  </g>

  <!-- Right Column: Tech Stack & Skills (Cute Typography) -->
  <g transform="translate(520, 30)">
    <!-- Header (Cute Italic + Heart) -->
    <text x="0" y="18" fill="#FFFFFF" font-size="18" font-weight="700" font-style="italic" letter-spacing="1" font-family="'Palatino Linotype', 'Georgia', 'PingFang SC', sans-serif">
      ♡ tech stack <tspan fill="#F5A9B8" font-size="13.5" font-style="normal" font-weight="500" letter-spacing="0.5">· 常用技术栈 ♡</tspan>
    </text>

    <!-- Skill Cards Grid with Cute Rounded Pills -->
    <g transform="translate(0, 42)">
      <!-- Skill 1: Rust -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="190" height="52" rx="12" fill="#141D42" stroke="#5BCEFA" stroke-opacity="0.5" stroke-width="1.2"/>
        <text x="16" y="24" fill="#F5A9B8" font-size="14.5" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
          🦀 Rust
        </text>
        <text x="16" y="42" fill="#BACBFF" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
          高性能 · 内存安全探索
        </text>
      </g>

      <!-- Skill 2: Python -->
      <g transform="translate(205, 0)">
        <rect x="0" y="0" width="190" height="52" rx="12" fill="#141D42" stroke="#BACBFF" stroke-opacity="0.5" stroke-width="1.2"/>
        <text x="16" y="24" fill="#5BCEFA" font-size="14.5" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
          🐍 Python
        </text>
        <text x="16" y="42" fill="#BACBFF" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
          数据分析 · 机器学习建模
        </text>
      </g>

      <!-- Skill 3: Time Series -->
      <g transform="translate(0, 64)">
        <rect x="0" y="0" width="190" height="52" rx="12" fill="#141D42" stroke="#5BCEFA" stroke-opacity="0.5" stroke-width="1.2"/>
        <text x="16" y="24" fill="#D6E4FE" font-size="14.5" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
          📊 Time Series
        </text>
        <text x="16" y="42" fill="#BACBFF" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
          时间序列规律与预测
        </text>
      </g>

      <!-- Skill 4: Tools -->
      <g transform="translate(205, 64)">
        <rect x="0" y="0" width="190" height="52" rx="12" fill="#141D42" stroke="#F5A9B8" stroke-opacity="0.5" stroke-width="1.2"/>
        <text x="16" y="24" fill="#FCE4EC" font-size="14.5" font-weight="700" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
          💻 Dev Tools
        </text>
        <text x="16" y="42" fill="#BACBFF" font-size="11" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
          Git · VS Code · Markdown
        </text>
      </g>

      <!-- Bottom Note in Cute Italic -->
      <text x="4" y="145" fill="#BACBFF" font-size="12" font-style="italic" font-family="'Palatino Linotype', 'Georgia', 'PingFang SC', sans-serif">
        ✧ 专注数据挖掘、时间序列建模与高效工具开发 ✧
      </text>
    </g>
  </g>
</svg>
