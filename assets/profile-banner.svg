<svg width="960" height="360" viewBox="0 0 960 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">୨୧ Saki ✦ 小花凉ovo &amp; Moonlit Starry Profile Banner ୨୧</title>
  <desc id="bannerDesc">An adorable Ave Mujica and Togawa Sakiko themed profile banner with dynamic shooting stars, twinkling night sky, breathing nebulas, cute sticker-outline typography, and floating musical notes.</desc>

  <defs>
    <!-- Sky Base Gradient -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080D24"/>
      <stop offset="35%" stop-color="#11183C"/>
      <stop offset="70%" stop-color="#21173A"/>
      <stop offset="100%" stop-color="#0C1028"/>
    </linearGradient>

    <!-- Glowing Card Border -->
    <linearGradient id="bannerBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5BCEFA" stop-opacity="0.95"/>
      <stop offset="30%" stop-color="#BACBFF" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#F5A9B8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5BCEFA" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Blue Pink White Title Gradient -->
    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5BCEFA"/>
      <stop offset="25%" stop-color="#F5A9B8"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#F5A9B8"/>
      <stop offset="100%" stop-color="#5BCEFA"/>
    </linearGradient>

    <!-- Moon Glow Halo -->
    <radialGradient id="moonHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#D0E2FF" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#7FA8F5" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#090E24" stop-opacity="0"/>
    </radialGradient>

    <!-- Shooting Star Gradient -->
    <linearGradient id="meteorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="50%" stop-color="#BACBFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>

    <!-- Cute Sticker Shadow Filter -->
    <filter id="stickerShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#3B6CD4" flood-opacity="0.5"/>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="960" height="360" rx="24" fill="url(#skyGrad)"/>

  <!-- DYNAMIC LAYER 1: Vivid Cosmic Breathing Nebulas (动态星云光斑) -->
  <g filter="url(#softGlow)">
    <!-- Blue Cosmic Nebula Pulse -->
    <ellipse cx="240" cy="150" rx="190" ry="120" fill="#3B6CD4" opacity="0.42">
      <animate attributeName="cx" values="240; 300; 240" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="150; 120; 150" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.32; 0.52; 0.32" dur="6.5s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Sakura Pink Cosmic Nebula Pulse -->
    <ellipse cx="730" cy="210" rx="180" ry="110" fill="#D95A8D" opacity="0.36">
      <animate attributeName="cx" values="730; 670; 730" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="210; 240; 210" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.26; 0.48; 0.26" dur="7.5s" repeatCount="indefinite"/>
    </ellipse>
    <!-- Top Center Lavender Starlight -->
    <circle cx="480" cy="110" r="140" fill="#7052A3" opacity="0.3">
      <animate attributeName="opacity" values="0.2; 0.42; 0.2" dur="5.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- DYNAMIC LAYER 2: Animated Shooting Stars (天际双流星划过) -->
  <g>
    <!-- Meteor 1 (Glides across top left every 6.5s) -->
    <g opacity="0">
      <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0" keyTimes="0; 0.15; 0.22; 0.42; 0.48; 1" dur="6.5s" repeatCount="indefinite"/>
      <line x1="60" y1="15" x2="210" y2="90" stroke="url(#meteorGrad)" stroke-width="2.6" stroke-linecap="round">
        <animateTransform attributeName="transform" type="translate" values="-180 -90; 260 130" dur="6.5s" repeatCount="indefinite"/>
      </line>
      <circle cx="210" cy="90" r="3.2" fill="#FFFFFF" filter="url(#starGlow)">
        <animateTransform attributeName="transform" type="translate" values="-180 -90; 260 130" dur="6.5s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Meteor 2 (Glides across center right every 9s) -->
    <g opacity="0">
      <animate attributeName="opacity" values="0; 0; 0.95; 0.95; 0; 0" keyTimes="0; 0.52; 0.58; 0.78; 0.84; 1" dur="9s" repeatCount="indefinite"/>
      <line x1="580" y1="20" x2="730" y2="95" stroke="url(#meteorGrad)" stroke-width="2.4" stroke-linecap="round">
        <animateTransform attributeName="transform" type="translate" values="-160 -80; 240 120" dur="9s" repeatCount="indefinite"/>
      </line>
      <circle cx="730" cy="95" r="3" fill="#FCE4EC" filter="url(#starGlow)">
        <animateTransform attributeName="transform" type="translate" values="-160 -80; 240 120" dur="9s" repeatCount="indefinite"/>
      </circle>
    </g>
  </g>

  <!-- DYNAMIC LAYER 3: Twinkling Starfield (动态呼吸群星) -->
  <g fill="#FFFFFF" filter="url(#starGlow)">
    <!-- Star 1 -->
    <circle cx="65" cy="80" r="2.2">
      <animate attributeName="opacity" values="0.25; 1; 0.25" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1.4; 2.8; 1.4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <!-- Star 2 -->
    <circle cx="150" cy="45" r="2">
      <animate attributeName="opacity" values="0.3; 1; 0.3" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1.2; 2.6; 1.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <!-- Star 3 -->
    <circle cx="280" cy="70" r="2.4">
      <animate attributeName="opacity" values="0.2; 0.95; 0.2" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1.4; 3; 1.4" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <!-- Star 4 -->
    <circle cx="410" cy="40" r="1.8">
      <animate attributeName="opacity" values="0.2; 1; 0.2" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <!-- Star 5 -->
    <circle cx="580" cy="55" r="2.2">
      <animate attributeName="opacity" values="0.3; 1; 0.3" dur="2.3s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1.3; 2.8; 1.3" dur="2.3s" repeatCount="indefinite"/>
    </circle>
    <!-- Star 6 -->
    <circle cx="680" cy="85" r="2.4">
      <animate attributeName="opacity" values="0.2; 0.95; 0.2" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <!-- Star 7 -->
    <circle cx="760" cy="45" r="1.8">
      <animate attributeName="opacity" values="0.15; 1; 0.15" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <!-- Star 8 -->
    <circle cx="900" cy="210" r="2.4">
      <animate attributeName="opacity" values="0.25; 1; 0.25" dur="2.1s" repeatCount="indefinite"/>
      <animate attributeName="r" values="1.5; 3; 1.5" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <!-- Star 9 -->
    <circle cx="80" cy="230" r="2">
      <animate attributeName="opacity" values="0.2; 0.95; 0.2" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <!-- Star 10 -->
    <circle cx="180" cy="260" r="1.8">
      <animate attributeName="opacity" values="0.3; 1; 0.3" dur="2.5s" repeatCount="indefinite"/>
    </circle>

    <!-- Rotating Sparkle Stars ✧ -->
    <g transform="translate(120, 60)">
      <path d="M0 -11 L2.5 -3 L10 0 L2.5 3 L0 11 L-2.5 3 L-10 0 L-2.5 -3 Z" fill="#FCE4EC">
        <animate attributeName="opacity" values="0.4; 1; 0.4" dur="2.8s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(865, 240)">
      <path d="M0 -10 L2.2 -2.5 L9 0 L2.2 2.5 L0 10 L-2.2 2.5 L-9 0 L-2.2 -2.5 Z" fill="#5BCEFA">
        <animate attributeName="opacity" values="0.35; 1; 0.35" dur="2.4s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="13s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(320, 240)">
      <path d="M0 -8 L2 -2 L7 0 L2 2 L0 8 L-2 2 L-7 0 L-2 -2 Z" fill="#F5A9B8">
        <animate attributeName="opacity" values="0.3; 0.95; 0.3" dur="3.1s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- Constellation Connecting Dashlines -->
  <g stroke="#BACBFF" stroke-width="0.9" stroke-opacity="0.4" stroke-dasharray="3 4">
    <line x1="65" y1="80" x2="150" y2="45"/>
    <line x1="150" y1="45" x2="280" y2="70"/>
    <line x1="580" y1="55" x2="680" y2="85"/>
    <line x1="680" y1="85" x2="760" y2="45"/>
    <line x1="760" y1="45" x2="820" y2="95"/>
  </g>

  <!-- Crescent Moon with Breathing Halo & Slowly Rotating Orbital Rings -->
  <g transform="translate(820, 95)" filter="url(#starGlow)">
    <!-- Breathing Moon Halo -->
    <circle cx="0" cy="0" r="95" fill="url(#moonHalo)">
      <animate attributeName="r" values="85; 112; 85" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.75; 1; 0.75" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <!-- Moon Body -->
    <circle cx="0" cy="0" r="38" fill="#FFFFFF"/>
    <circle cx="-16" cy="-10" r="35" fill="#0E1534"/>

    <!-- Rotating Orbital Rings -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="32s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="54" stroke="#BACBFF" stroke-width="1.2" stroke-dasharray="4 6" stroke-opacity="0.65"/>
      <circle cx="54" cy="0" r="2.8" fill="#FFFFFF"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="40s" repeatCount="indefinite"/>
      <circle cx="0" cy="0" r="70" stroke="#F5A9B8" stroke-width="1" stroke-dasharray="3 8" stroke-opacity="0.55"/>
      <circle cx="-70" cy="0" r="2.2" fill="#FCE4EC"/>
    </g>
  </g>

  <!-- DYNAMIC LAYER 4: Floating Musical Notes & Ribbon Hearts ♪ ♫ ♡ -->
  <g filter="url(#starGlow)">
    <!-- Floating Note 1 -->
    <g transform="translate(75, 145)">
      <animateTransform attributeName="transform" type="translate" values="75 145; 78 132; 75 122; 72 133; 75 145" dur="5s" repeatCount="indefinite"/>
      <text x="0" y="0" fill="#5BCEFA" font-size="22" font-family="'Segoe UI Symbol', sans-serif">♪</text>
    </g>
    <!-- Floating Note 2 -->
    <g transform="translate(230, 48)">
      <animateTransform attributeName="transform" type="translate" values="230 48; 233 38; 230 28; 227 38; 230 48" dur="6s" repeatCount="indefinite"/>
      <text x="0" y="0" fill="#F5A9B8" font-size="24" font-family="'Segoe UI Symbol', sans-serif">♫</text>
    </g>
    <!-- Floating Heart 3 -->
    <g transform="translate(735, 140)">
      <animateTransform attributeName="transform" type="translate" values="735 140; 738 128; 735 118; 732 129; 735 140" dur="4.6s" repeatCount="indefinite"/>
      <text x="0" y="0" fill="#F5A9B8" font-size="19" font-family="'Segoe UI Symbol', sans-serif">♡</text>
    </g>
  </g>

  <!-- Stylized Piano Keys along Lower Border -->
  <g transform="translate(0, 325)">
    <line x1="0" y1="0" x2="960" y2="0" stroke="#7E9FE6" stroke-width="1.2"/>
    <path d="M 0 0 L 960 0 L 960 35 L 0 35 Z" fill="#0A0F26" fill-opacity="0.9"/>
    <!-- Key dividers -->
    <g stroke="#7E9FE6" stroke-width="0.8" stroke-opacity="0.45">
      <line x1="30" y1="0" x2="30" y2="35"/><line x1="60" y1="0" x2="60" y2="35"/><line x1="90" y1="0" x2="90" y2="35"/>
      <line x1="120" y1="0" x2="120" y2="35"/><line x1="150" y1="0" x2="150" y2="35"/><line x1="180" y1="0" x2="180" y2="35"/>
      <line x1="210" y1="0" x2="210" y2="35"/><line x1="240" y1="0" x2="240" y2="35"/><line x1="270" y1="0" x2="270" y2="35"/>
      <line x1="300" y1="0" x2="300" y2="35"/><line x1="330" y1="0" x2="330" y2="35"/><line x1="360" y1="0" x2="360" y2="35"/>
      <line x1="390" y1="0" x2="390" y2="35"/><line x1="420" y1="0" x2="420" y2="35"/><line x1="450" y1="0" x2="450" y2="35"/>
      <line x1="480" y1="0" x2="480" y2="35"/><line x1="510" y1="0" x2="510" y2="35"/><line x1="540" y1="0" x2="540" y2="35"/>
      <line x1="570" y1="0" x2="570" y2="35"/><line x1="600" y1="0" x2="600" y2="35"/><line x1="630" y1="0" x2="630" y2="35"/>
      <line x1="660" y1="0" x2="660" y2="35"/><line x1="690" y1="0" x2="690" y2="35"/><line x1="720" y1="0" x2="720" y2="35"/>
      <line x1="750" y1="0" x2="750" y2="35"/><line x1="780" y1="0" x2="780" y2="35"/><line x1="810" y1="0" x2="810" y2="35"/>
      <line x1="840" y1="0" x2="840" y2="35"/><line x1="870" y1="0" x2="870" y2="35"/><line x1="900" y1="0" x2="900" y2="35"/>
      <line x1="930" y1="0" x2="930" y2="35"/>
    </g>
    <!-- Black Keys -->
    <g fill="#161F42" stroke="#3D5080" stroke-width="0.6">
      <rect x="21" y="0" width="18" height="20" rx="1.5"/><rect x="51" y="0" width="18" height="20" rx="1.5"/>
      <rect x="111" y="0" width="18" height="20" rx="1.5"/><rect x="141" y="0" width="18" height="20" rx="1.5"/><rect x="171" y="0" width="18" height="20" rx="1.5"/>
      <rect x="231" y="0" width="18" height="20" rx="1.5"/><rect x="261" y="0" width="18" height="20" rx="1.5"/>
      <rect x="321" y="0" width="18" height="20" rx="1.5"/><rect x="351" y="0" width="18" height="20" rx="1.5"/><rect x="381" y="0" width="18" height="20" rx="1.5"/>
      <rect x="441" y="0" width="18" height="20" rx="1.5"/><rect x="471" y="0" width="18" height="20" rx="1.5"/>
      <rect x="531" y="0" width="18" height="20" rx="1.5"/><rect x="561" y="0" width="18" height="20" rx="1.5"/><rect x="591" y="0" width="18" height="20" rx="1.5"/>
      <rect x="651" y="0" width="18" height="20" rx="1.5"/><rect x="681" y="0" width="18" height="20" rx="1.5"/>
      <rect x="741" y="0" width="18" height="20" rx="1.5"/><rect x="771" y="0" width="18" height="20" rx="1.5"/><rect x="801" y="0" width="18" height="20" rx="1.5"/>
      <rect x="861" y="0" width="18" height="20" rx="1.5"/><rect x="891" y="0" width="18" height="20" rx="1.5"/>
    </g>
  </g>

  <!-- Luminous Border with Breathing Glow -->
  <rect x="1" y="1" width="958" height="358" rx="23" stroke="url(#bannerBorder)" stroke-width="2">
    <animate attributeName="stroke-opacity" values="0.6; 1; 0.6" dur="3.8s" repeatCount="indefinite"/>
  </rect>

  <!-- CUTE TYPOGRAPHY LAYER (精确调校的可爱贴纸描边 + 蓝粉渐变双层艺术字) -->
  <g text-anchor="middle">
    <!-- Top Cute Subheader: Ave Mujica & Ribbon -->
    <text x="480" y="68" fill="#C5D8FF" font-size="13" font-weight="700" letter-spacing="3" font-family="'Palatino Linotype', 'Georgia', 'M PLUS Rounded 1c', serif">
      ♡  A v e   M u j i c a  ·  T o g a w a   S a k i k o  ♡
    </text>

    <!-- Main Title with Cute Sticker Outline (8px 白描边防文字粘连 + 蓝粉白三色渐变填充) -->
    <g filter="url(#stickerShadow)">
      <!-- Layer 1: Clean Sticker White Outline -->
      <text x="480" y="142" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" paint-order="stroke" font-size="44" font-weight="700" font-style="italic" letter-spacing="1.5" font-family="'Palatino Linotype', 'Georgia', 'PingFang SC', 'Microsoft YaHei', sans-serif">
        ୨୧ hi, i'm 小花凉ovo ୨୧
      </text>
      <!-- Layer 2: Soft Blue-Pink-White Gradient Fill -->
      <text x="480" y="142" fill="url(#titleGradient)" stroke="#E1ECFE" stroke-width="1" stroke-opacity="0.4" paint-order="stroke" font-size="44" font-weight="700" font-style="italic" letter-spacing="1.5" font-family="'Palatino Linotype', 'Georgia', 'PingFang SC', 'Microsoft YaHei', sans-serif">
        ୨୧ hi, i'm 小花凉ovo ୨୧
      </text>
    </g>

    <!-- Japanese Poetic Subtitle in Soft Italic Styling -->
    <text x="480" y="186" fill="#F8BBD0" font-size="16" font-style="italic" font-weight="600" letter-spacing="1.5" font-family="'Palatino Linotype', 'Georgia', 'Hiragino Sans', 'PingFang SC', serif">
      “ 羽ばたくことも許されぬまま、それでも星々の夜を紡ぐ ✧ ”
    </text>

    <!-- English Description in Cute Spacing -->
    <text x="480" y="222" fill="#BACBFF" font-size="12" font-weight="600" letter-spacing="2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Quicksand', sans-serif">
      ✦ STUDENT · DEVELOPER · TIME SERIES &amp; RUST ENTHUSIAST ✦
    </text>

    <!-- 3 Capsule Badges with Cute Rounded Styling -->
    <g transform="translate(480, 274)">
      <!-- Badge 1 -->
      <g transform="translate(-230, 0)">
        <rect x="-105" y="-16" width="210" height="32" rx="16" fill="#141D42" fill-opacity="0.92" stroke="#5BCEFA" stroke-width="1.2"/>
        <text x="0" y="5" fill="#FCE4EC" font-size="12.5" font-weight="600" letter-spacing="0.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
          🎹 丰川祥子 · Ave Mujica
        </text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(0, 0)">
        <rect x="-105" y="-16" width="210" height="32" rx="16" fill="#141D42" fill-opacity="0.92" stroke="#BACBFF" stroke-width="1.2"/>
        <text x="0" y="5" fill="#E1ECFE" font-size="12.5" font-weight="600" letter-spacing="0.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
          📈 时间序列分析 &amp; 建模
        </text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(230, 0)">
        <rect x="-105" y="-16" width="210" height="32" rx="16" fill="#141D42" fill-opacity="0.92" stroke="#F5A9B8" stroke-width="1.2"/>
        <text x="0" y="5" fill="#FCE4EC" font-size="12.5" font-weight="600" letter-spacing="0.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
          🦀 Rust 学习与开发
        </text>
      </g>
    </g>
  </g>
</svg>
