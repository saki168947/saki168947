<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Soft blue pink white profile banner</title>
  <desc id="desc">A matte blue, pink, and white striped GitHub profile banner with soft paper texture.</desc>
  <defs>
    <filter id="paper" x="0" y="0" width="1200" height="320" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.72" numOctaves="2" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.98 0 0 0 0 0.98 0 0 0 0 0.98 0 0 0 0.18 0"/>
      <feBlend in2="SourceGraphic" mode="soft-light"/>
    </filter>
    <filter id="softShadow" x="260" y="70" width="680" height="175" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#7EBFE1" flood-opacity="0.16"/>
    </filter>
  </defs>

  <g filter="url(#paper)">
    <rect width="1200" height="320" rx="28" fill="#5BCEFA"/>
    <rect y="64" width="1200" height="64" fill="#F5A9B8"/>
    <rect y="128" width="1200" height="64" fill="#FFFFFF"/>
    <rect y="192" width="1200" height="64" fill="#F5A9B8"/>
    <rect y="256" width="1200" height="64" fill="#5BCEFA"/>
  </g>

  <path d="M0 51H1200" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2"/>
  <path d="M0 127H1200" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="2"/>
  <path d="M0 192H1200" stroke="#5BCEFA" stroke-opacity="0.16" stroke-width="2"/>
  <path d="M0 256H1200" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>

  <g filter="url(#softShadow)">
    <rect x="292" y="82" width="616" height="142" rx="28" fill="#FFFFFF" fill-opacity="0.62"/>
    <rect x="300" y="90" width="600" height="126" rx="22" stroke="#FFFFFF" stroke-opacity="0.74" stroke-width="2"/>
  </g>

  <g fill="#FFFFFF" fill-opacity="0.9">
    <path d="M194 72L199 82L209 87L199 92L194 102L189 92L179 87L189 82L194 72Z"/>
    <path d="M1000 62L1005 73L1016 78L1005 83L1000 94L995 83L984 78L995 73L1000 62Z"/>
    <path d="M264 220L268 228L276 232L268 236L264 244L260 236L252 232L260 228L264 220Z"/>
    <path d="M936 222L940 230L948 234L940 238L936 246L932 238L924 234L932 230L936 222Z"/>
    <circle cx="128" cy="174" r="6"/>
    <circle cx="1074" cy="174" r="6"/>
    <circle cx="404" cy="58" r="5"/>
    <circle cx="792" cy="268" r="5"/>
  </g>

  <text x="600" y="137" text-anchor="middle" fill="#4AAED8" font-size="48" font-weight="700" font-style="italic" letter-spacing="1" font-family="'Palatino Linotype', 'Georgia', serif">
    Welcome to My GitHub
  </text>
  <text x="600" y="180" text-anchor="middle" fill="#E78FA4" font-size="21" font-weight="600" font-style="italic" letter-spacing="1.4" font-family="'Georgia', 'Times New Roman', serif">
    blue sky • pink clouds • soft white pages
  </text>
</svg>
