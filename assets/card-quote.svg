<svg width="960" height="175" viewBox="0 0 960 175" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="quoteTitle">
  <title id="quoteTitle">✧ a tiny note · Twilight Monologue Card ✧</title>
  <desc id="quoteTitleDesc">A twilight monologue card with cute typography, animated twinkling stars, shooting star, and luminous breathing border.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090E24"/>
      <stop offset="50%" stop-color="#141B3B"/>
      <stop offset="100%" stop-color="#1E1636"/>
    </linearGradient>

    <!-- Card Border -->
    <linearGradient id="quoteBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5BCEFA" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#BACBFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#F5A9B8" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="meteorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="60%" stop-color="#BACBFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="starGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Card Base -->
  <rect width="960" height="175" rx="20" fill="url(#cardBg)"/>

  <!-- DYNAMIC BACKGROUND LAYER: Breathing Nebula & Twinkling Stars -->
  <g filter="url(#softGlow)">
    <circle cx="300" cy="85" r="140" fill="#3B6CD4" opacity="0.28">
      <animate attributeName="opacity" values="0.18; 0.38; 0.18" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="680" cy="90" r="140" fill="#D95A8D" opacity="0.25">
      <animate attributeName="opacity" values="0.15; 0.35; 0.15" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Shooting Star in Quote Card -->
  <g opacity="0">
    <animate attributeName="opacity" values="0; 0; 0.95; 0.95; 0; 0" keyTimes="0; 0.35; 0.4; 0.62; 0.67; 1" dur="7.5s" repeatCount="indefinite"/>
    <line x1="180" y1="15" x2="310" y2="70" stroke="url(#meteorGrad)" stroke-width="2" stroke-linecap="round">
      <animateTransform attributeName="transform" type="translate" values="-150 -70; 260 120" dur="7.5s" repeatCount="indefinite"/>
    </line>
    <circle cx="310" cy="70" r="2.6" fill="#FFFFFF" filter="url(#starGlow)">
      <animateTransform attributeName="transform" type="translate" values="-150 -70; 260 120" dur="7.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Twinkling Starlight Particles -->
  <g fill="#FFFFFF" filter="url(#starGlow)">
    <circle cx="90" cy="35" r="1.8">
      <animate attributeName="opacity" values="0.2; 1; 0.2" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="210" cy="145" r="1.8">
      <animate attributeName="opacity" values="0.1; 0.9; 0.1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="30" r="1.8">
      <animate attributeName="opacity" values="0.2; 0.95; 0.2" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="870" cy="140" r="2">
      <animate attributeName="opacity" values="0.15; 1; 0.15" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Luminous Animated Border -->
  <rect x="1" y="1" width="958" height="173" rx="19" stroke="url(#quoteBorder)" stroke-width="1.8">
    <animate attributeName="stroke-opacity" values="0.6; 1; 0.6" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Top Center Header (Cute Italic + Ribbon Style) -->
  <g transform="translate(480, 28)" text-anchor="middle">
    <text x="0" y="0" fill="#BACBFF" font-size="13" font-weight="700" font-style="italic" letter-spacing="1.5" font-family="'Palatino Linotype', 'Georgia', 'PingFang SC', 'Microsoft YaHei', sans-serif">
      ♡ a tiny note · 随笔与日常 ♡
    </text>
  </g>

  <!-- 3 Quotes Centered with Cute Typography & Heart/Star Accents -->
  <g text-anchor="middle" filter="url(#softShadow)">
    <text x="480" y="68" fill="#FFFFFF" font-size="16" font-weight="700" font-family="'Palatino Linotype', 'Georgia', 'PingFang SC', 'Microsoft YaHei', sans-serif">
      “ 世界如此残酷  但我依然爱你 ♡ ”
    </text>
    <text x="480" y="100" fill="#F8BBD0" font-size="15" font-style="italic" font-weight="600" letter-spacing="1" font-family="'Palatino Linotype', 'Georgia', 'Yu Mincho', 'PingFang SC', serif">
      “ 羽ばたくことも許されぬまま、それでも夜空を見上げている ✧ ”
    </text>
    <text x="480" y="132" fill="#5BCEFA" font-size="13.5" font-style="italic" font-weight="600" letter-spacing="1" font-family="'Palatino Linotype', 'Georgia', sans-serif">
      ୨୧ Still growing, still glowing. You are not alone. ୨୧
    </text>
  </g>
</svg>
